<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Masuk ke Panel Admin - SAMARA MindCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/admin.css">
  <script type="module" src="/src/js/auth.js"></script>
</head>
<body data-page="login" class="lg-body">
<main class="lg-wrap">
  <div class="lg-card">
    <header class="lg-head">
      <img class="lg-logo-img" src="/logo/logo-horizontal.png" alt="SAMARA MindCare" width="426" height="143" decoding="async">
      <span class="lg-chip">Admin</span>
    </header>

    <h1 class="lg-title" id="lg-title">Masuk ke Panel Admin</h1>
    <p class="lg-sub" id="lg-sub">Khusus guru dan pimpinan SMA Muhammadiyah 2 Samarinda.</p>

    <!-- Kotak error: hanya tampil saat login gagal -->
    <div class="lg-error" id="lg-error" role="alert" hidden>
      <span class="lg-err-ic"><i data-ic="alert"></i></span>
      <div>
        <p class="lg-err-title" id="lg-err-title"></p>
        <p class="lg-err-text" id="lg-err-text"></p>
      </div>
      <button type="button" class="lg-err-x" id="lg-err-x" aria-label="Tutup pesan"><i data-ic="x"></i></button>
    </div>

    <!-- Email + kata sandi + Cloudflare Turnstile -->
    <form id="login-form" method="post" action="#" novalidate>
      <div class="lg-field">
        <label for="email">Alamat Email</label>
        <div class="lg-input"><i data-ic="mail"></i><input id="email" name="email" type="email" autocomplete="username" placeholder="Masukkan alamat email" required></div>
      </div>
      <div class="lg-field">
        <div class="lg-label-row"><label for="password">Kata Sandi</label></div>
        <div class="lg-input"><i data-ic="lock"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          <button type="button" class="lg-eye" id="lg-eye" aria-label="Tampilkan kata sandi"><i data-ic="eye"></i></button></div>
      </div>
      <div id="turnstile-box" class="captcha-box"></div>
      <button class="lg-btn" type="submit" id="lg-submit"><span>Masuk ke Panel</span><i data-ic="arrow"></i></button>
    </form>

    <a class="lg-back" href="/index.html"><i data-ic="arrowleft"></i> Kembali ke Beranda Utama </a>

    <p class="lg-note"><i data-ic="shieldcheck"></i><span><b>Akses Terbatas &amp; Tercatat:</b> Sistem pelaporan SAMARA menjamin kerahasiaan laporan siswa 100% tanpa menyimpan data pengenal perangkat atau riwayat jaringan pribadi.</span></p>
  </div>
</main>
</body>
</html>
